<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example: Name Entry + sessionStorage</title>
  <link rel="stylesheet" href="../assets/css/examples.css" />
</head>
<body>

  <div class="container py-5" style="max-width: 480px;">
    <h1 class="mb-3">Name Entry Example</h1>
    <p class="text-muted">
      Type a name and submit, or leave it blank for a random guest name.
      The name is saved to <code>sessionStorage</code>, so it survives a page
      refresh but clears when you close the tab.
    </p>

    <form id="nameForm" class="d-flex gap-2 mb-3">
      <input id="nameInput" type="text" class="form-control" placeholder="Your name (optional)" />
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-box-arrow-in-right me-1"></i>Play
      </button>
    </form>

    <button id="clearBtn" class="btn btn-outline-secondary btn-sm mb-4">
      <i class="bi bi-arrow-counterclockwise me-1"></i>Clear sessionStorage
    </button>

    <p id="greeting" class="fs-4 fw-semibold"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/name-entry.js"></script>
</body>
</html>
